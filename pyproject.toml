[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudshield"
version = "0.1.0"
description = "CloudShield: 클라우드 하이브리드 위협 탐지·자동 대응 및 SecOps 파이프라인"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "moto[ec2,iam,wafv2]>=5.0.0",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-socket>=0.7.0",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --disable-socket --allow-unix-socket"
