  position: relative;
  width: 1200px;
  height: 500px;
  background: #ffffff;
  background-image:
    linear-gradient(#faf9f5 1px, transparent 1px),
    linear-gradient(90deg, #faf9f5 1px, transparent 1px);
  background-size: 24px 24px;
  background-position: -1px -1px;
}
.group { position:absolute; border-radius: 12px; }
.g-label { position:absolute; top:12px; left:16px; display:flex; align-items:center; gap:8px;
  font-family: 'Pretendard', sans-serif; font-size: 13px; font-weight: 700; color: #334155; white-space: nowrap; }
.g-label img { width: 18px; height: 18px; }

.group.g-target { border: 2px solid #7c3aed; background: rgba(245, 243, 255, 0.4); }
.group.g-core   { border: 2px solid #0284c7; background: rgba(240, 249, 255, 0.4); }
.group.g-resp   { border: 2px solid #16a34a; background: rgba(240, 253, 244, 0.4); }

.node { position:absolute; width:140px; text-align:center; }
.tile { width:68px; height:68px; margin:0 auto; border-radius: 12px;
  background:#fff; border:1.5px solid #cfcabf; display:grid; place-items:center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.node:hover .tile { border-color: #2563eb; }
.tile img { width:42px; height:42px; object-fit:contain; }
.tile.bare { background:none; border:none; box-shadow:none; }
.tile.bare img { width:68px; height:68px; }
.tile.dark { background: #1c1917; border-color: #1c1917; }
.node .name { font-family: 'Pretendard', sans-serif; font-weight:700; font-size:14px; margin-top: 10px; color:#1c1917; white-space:nowrap; }
.node .role { font-family: 'Pretendard', sans-serif; font-size:12px; font-weight:500; color:#57534e; margin-top:4px; white-space:nowrap; }
.node .name span, .node .role span { background: rgba(250, 249, 245, 0.96);
  padding: 1px 6px; border-radius: 4px; box-shadow: 0 0 3px rgba(255,255,255,0.9); }

svg.edges { position:absolute; inset:0; width:1200px; height:500px; pointer-events:none; }
.e  { stroke: #2563eb; stroke-width:2.4; fill:none; }
.n  { stroke: #57534e; stroke-width:1.8; fill:none; }
.dash { stroke-dasharray:5 4; }
.el { font-family: 'Pretendard', sans-serif; font-size:11px; font-weight:700; fill: #1e293b;
  paint-order: stroke; stroke: #ffffff; stroke-width:4.5px; stroke-linejoin:round; }
.el.a { fill: #2563eb; }

  </style>

            slideHtml += `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5 text-left py-1">
                <div class="terminal-window">
                  <div class="terminal-header">
                    <span class="terminal-dot dot-red"></span>
                    <span class="text-[13px] font-mono text-stone-400 ml-2">${s.data.left?.title || ''}</span>
                  </div>
                  <div class="p-3 font-mono text-[13px] text-stone-200 space-y-1 max-h-56 overflow-y-auto">
                    ${(s.data.left?.lines || []).map(l => `<div>${l}</div>`).join('')}
                  </div>
                </div>

                <div class="terminal-window">
                  <div class="terminal-header">
                    <span class="terminal-dot dot-green"></span>
                    <span class="text-[13px] font-mono text-stone-400 ml-2">${s.data.right?.title || ''}</span>
                  </div>
                  <div class="p-3 font-mono text-[13px] text-stone-200 space-y-2 max-h-56 overflow-y-auto">
                    ${(s.data.right?.events || []).map(ev => `
                      <div class="space-y-0.5">
                        <div class="flex items-center gap-2">
                          <span class="text-[13px] font-mono px-1.5 py-0.2 rounded bg-stone-800 text-stone-300 font-bold">${ev.time || ''}</span>
                          <span class="text-xs font-bold ${ev.semantic === 'success' ? 'text-emerald-400' : 'text-amber-300'}">${ev.title || ''}</span>
                        </div>
                        <div class="text-[13px] text-stone-400 pl-1">${ev.desc || ''}</div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            `;
          } else if (s.slideNumber === 13) {
            // ========================================================
            // SLIDE 13: three-pillars-conclusion (s.data.pillars 100% 동적 렌더링)
            // ========================================================
            slideHtml += `
              <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-left py-4">
                ${(s.data.pillars || []).map(p => `
                  <div class="border-t-2 border-stone-800 pt-3.5 space-y-2">
                    <div class="text-[13px] font-mono font-bold text-brand-700">${p.num}</div>
                    <div class="text-xl font-black text-stone-900">${p.title}</div>
                    <p class="text-sm text-stone-600 leading-relaxed mt-1.5">${p.desc}</p>
                  </div>
                `).join('')}
              </div>
            `;
          } else if (s.slideNumber === 14) {
            // ========================================================
            // SLIDE 14: qa-defense-cards (s.data.qas 100% 동적 렌더링)
            // ========================================================
            slideHtml += `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left py-1">
                ${(s.data.qas || []).map(qa => `
                  <div class="border-t-2 border-stone-800 pt-3 space-y-1.5">
                    <div class="text-sm font-extrabold text-stone-900">Q. ${qa.q}</div>
                    <div class="text-[13px] text-stone-600 leading-relaxed">A. ${qa.a}</div>
                  </div>
                `).join('')}
              </div>
            `;
          }

          slideHtml += `</div>`;
        }

        section.innerHTML = slideHtml;
        slideContainer.appendChild(section);
      });

      // 토폴로지 반응형 스케일 계산 함수
      function adjustTopologyScale() {
        const viewport = document.getElementById('topoViewport');
        const scaler = document.getElementById('topoScaler');
        if (!viewport || !scaler) return;

        const containerWidth = viewport.clientWidth;
        const baseWidth = 1200;
        const baseHeight = 500;

        const mainEl = document.querySelector('main');
        const availableHeight = mainEl ? (mainEl.clientHeight - 90) : 420;

        const scaleX = containerWidth / baseWidth;
        const scaleY = availableHeight / baseHeight;
        const scale = Math.min(scaleX, scaleY, 0.95);

        scaler.style.transform = `scale(${scale})`;
        viewport.style.height = `${baseHeight * scale}px`;
      }

      // SLIDE 02 anime.js 전용 스텝 전환 함수
      function goToSlide2Step(step, animate = true) {
        slide2Step = step;
        const step1 = document.getElementById('slide2-step1');
        const step2 = document.getElementById('slide2-step2');
        if (!step1 || !step2) return;

        if (step === 2) {
          if (animate && window.anime) {
            anime({
              targets: '#slide2-step1',
              opacity: [1, 0],
              translateY: [0, -10],
              duration: 200,
              easing: 'easeOutQuad',
              complete: () => {
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                anime({
                  targets: '#slide2-step2',
                  opacity: [0, 1],
                  translateY: [10, 0],
                  duration: 250,
                  easing: 'easeOutQuad'
                });
                if (window.lucide) window.lucide.createIcons();
              }
            });
          } else {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            step2.style.opacity = '1';
            step2.style.transform = 'none';
            if (window.lucide) window.lucide.createIcons();
          }
        } else {
          if (animate && window.anime) {
            anime({
              targets: '#slide2-step2',
              opacity: [1, 0],
              translateY: [0, 10],
              duration: 200,
              easing: 'easeOutQuad',
              complete: () => {
                step2.classList.add('hidden');
                step1.classList.remove('hidden');
                anime({
                  targets: '#slide2-step1',
                  opacity: [0, 1],
                  translateY: [-10, 0],
                  duration: 250,
                  easing: 'easeOutQuad'
                });
                if (window.lucide) window.lucide.createIcons();
              }
            });
          } else {
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
            step1.style.opacity = '1';
            step1.style.transform = 'none';
            if (window.lucide) window.lucide.createIcons();
          }
        }
      }

      // SLIDE 05 anime.js 전용 스텝 전환 함수
      function goToSlide5Step(step, animate = true) {
        slide5Step = step;
        const step1 = document.getElementById('slide5-step1');
        const step2 = document.getElementById('slide5-step2');
        if (!step1 || !step2) return;

        if (step === 2) {
          if (animate && window.anime) {
            anime({
              targets: '#slide5-step1',
              opacity: [1, 0],
              translateY: [0, -10],
              duration: 200,
              easing: 'easeOutQuad',
              complete: () => {
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                anime({
                  targets: '#slide5-step2',
                  opacity: [0, 1],
                  translateY: [10, 0],
                  duration: 250,
                  easing: 'easeOutQuad'
                });
                if (window.lucide) window.lucide.createIcons();
              }
            });
          } else {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            step2.style.opacity = '1';
            step2.style.transform = 'none';
            if (window.lucide) window.lucide.createIcons();
          }
        } else {
          if (animate && window.anime) {
            anime({
              targets: '#slide5-step2',
              opacity: [1, 0],
              translateY: [0, 10],
              duration: 200,
              easing: 'easeOutQuad',
              complete: () => {
                step2.classList.add('hidden');
                step1.classList.remove('hidden');
                anime({
                  targets: '#slide5-step1',
                  opacity: [0, 1],
                  translateY: [-10, 0],
                  duration: 250,
                  easing: 'easeOutQuad'
                });
                if (window.lucide) window.lucide.createIcons();
              }
            });
          } else {
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
            step1.style.opacity = '1';
            step1.style.transform = 'none';
            if (window.lucide) window.lucide.createIcons();
          }
        }
      }

      // 전역 바인딩 (인라인 onclick용)
      window.triggerSlide2Step = function(step) {
        goToSlide2Step(step, true);
      };
      window.triggerSlide5Step = function(step) {
        goToSlide5Step(step, true);
      };

      // 슬라이드 갱신 함수
      function updateSlide(newSlide) {
        if (newSlide < 1 || newSlide > totalSlides) return;
        currentSlide = newSlide;

        const allSlides = document.querySelectorAll('.slide');
        allSlides.forEach(s => s.classList.remove('active'));

        const target = document.querySelector(`.slide[data-slide="${currentSlide}"]`);
        if (target) target.classList.add('active');

        // SLIDE 02 및 SLIDE 05 진입 시 항상 Step 1으로 초기화
        if (currentSlide === 2) {
          goToSlide2Step(1, false);
        }
        if (currentSlide === 5) {
          goToSlide5Step(1, false);
        }

        // 메타데이터 갱신
        const currentData = slidesData[currentSlide - 1];
        if (currentData) {
          speakerBadge.textContent = currentData.speaker;
          slideIndicator.textContent = `${String(currentSlide).padStart(2, '0')} / ${String(totalSlides).padStart(2, '0')}`;
          progressGauge.style.width = `${(currentSlide / totalSlides) * 100}%`;

          notesContent.textContent = (currentData.script || '').trim().split('\n').map(l => l.trim()).filter(Boolean).join('\n\n');
        }

        if (currentSlide === 7) {
          setTimeout(adjustTopologyScale, 30);
        }

        if (window.lucide) {
          window.lucide.createIcons();
        }
      }

      function nextSlide() {
        // SLIDE 02에서 Step 1인 경우 Step 2로 전환
        if (currentSlide === 2 && slide2Step === 1) {
          goToSlide2Step(2, true);
          return;
        }
        // SLIDE 05에서 Step 1인 경우 Step 2로 전환
        if (currentSlide === 5 && slide5Step === 1) {
          goToSlide5Step(2, true);
          return;
        }
        if (currentSlide < totalSlides) {
          updateSlide(currentSlide + 1);
        }
      }

      function prevSlide() {
        // SLIDE 02에서 Step 2인 경우 Step 1으로 복귀
        if (currentSlide === 2 && slide2Step === 2) {
          goToSlide2Step(1, true);
          return;
        }
        // SLIDE 05에서 Step 2인 경우 Step 1으로 복귀
        if (currentSlide === 5 && slide5Step === 2) {
          goToSlide5Step(1, true);
          return;
        }
        if (currentSlide > 1) {
          updateSlide(currentSlide - 1);
        }
      }

      function toggleNotes() {
        notesVisible = !notesVisible;
        notesPanel.classList.toggle('hidden', !notesVisible);
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          document.body.classList.add('is-fullscreen');
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
          document.body.classList.remove('is-fullscreen');
        }
      }

      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
          document.body.classList.remove('is-fullscreen');
        } else {
          document.body.classList.add('is-fullscreen');
        }
        if (currentSlide === 7) setTimeout(adjustTopologyScale, 100);
      });

      // 이벤트 바인딩
      prevBtn.addEventListener('click', prevSlide);
      nextBtn.addEventListener('click', nextSlide);
      toggleNotesBtn.addEventListener('click', toggleNotes);
      closeNotesBtn.addEventListener('click', toggleNotes);

      window.addEventListener('resize', () => {
        if (currentSlide === 7) adjustTopologyScale();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'n' || e.key === 'N') {
          toggleNotes();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        }
      });

      // 초기화
      updateSlide(1);
    })();
  </script>
</body>
</html>
