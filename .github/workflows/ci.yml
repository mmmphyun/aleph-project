name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Verify R&R Scope Boundary
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: uv run python scripts/verify_rnr_scope.py

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Check Ruff Formatting
        run: uv run ruff format --check .

      - name: Verify Test File Location
        run: |
          WRONG_TESTS=$(find . -type f -name "test_*.py" -not -path "./tests/*" -not -path "./.venv/*")
          if [ -n "$WRONG_TESTS" ]; then
            echo "::error::표준 경로(tests/) 외부에 단위 테스트 파일이 발견되었습니다:"
            echo "$WRONG_TESTS"
            echo "모든 단위 테스트는 tests/unit/ 또는 tests/ 하위에 위치해야 합니다."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/*.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Initialize Terraform Modules for Mock Tests
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          terraform -chdir=infra/terraform/modules/vpc init -backend=false -input=false
          terraform -chdir=infra/terraform/modules/quarantine_sg init -backend=false -input=false
          terraform -chdir=infra/terraform/modules/waf init -backend=false -input=false

      - name: Run Contract & Unit Tests
        env:
          CLOUDSHIELD_REQUIRE_WAF_TERRAFORM: "1"
          CLOUDSHIELD_TF_DATA_VPC: "${{ github.workspace }}/infra/terraform/modules/vpc/.terraform"
          CLOUDSHIELD_TF_DATA_QUARANTINE_SG: "${{ github.workspace }}/infra/terraform/modules/quarantine_sg/.terraform"
        run: |
          export CLOUDSHIELD_TERRAFORM=$(which terraform)
          uv run pytest -v
