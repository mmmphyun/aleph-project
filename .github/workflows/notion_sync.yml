name: Notion Task Sync

on:
  pull_request_target:
    types: [opened, reopened, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync_notion:
    name: Sync PR State to Notion
    runs-on: ubuntu-latest
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
    steps:
      - name: Check Notion API Key Secret
        id: check_secret
        run: |
          if [ -z "$NOTION_API_KEY" ]; then
            echo "Notion API Key가 등록되지 않아 동기화를 안전하게 건너뜁니다 (Skip)."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract Notion Page ID and Update Status
        if: steps.check_secret.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const isMerged = pr.merged;
            const action = context.payload.action;

            // 1. PR 본문에서 Notion URL 또는 Page ID 추출 (32자리 hex)
            const regex = /notion\.(?:so|com)\/(?:[^/]+\/)?(?:[a-zA-Z0-9_-]+-)?([0-9a-f]{32})|([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i;
            const match = body.match(regex);

            if (!match) {
              console.log("PR 본문에서 Notion Task 링크를 찾을 수 없습니다.");
              return;
            }

            let pageId = match[1] || match[2];
            pageId = pageId.replace(/-/g, "");

            // 2. 전이할 대상 상태(Status) 결정
            let targetStatus = "";
            if (action === "opened" || action === "reopened") {
              targetStatus = "In Review";
            } else if (action === "closed" && isMerged) {
              targetStatus = "Done";
            } else {
              console.log("동기화 대상 이벤트가 아닙니다 (action: " + action + ", merged: " + isMerged + ")");
              return;
            }

            console.log(`Notion Page ID [${pageId}] 상태를 [${targetStatus}] 로 업데이트합니다.`);

            // 3. Notion API PATCH 호출
            const https = require("https");
            const data = JSON.stringify({
              properties: {
                Status: {
                  status: {
                    name: targetStatus
                  }
                }
              }
            });

            const options = {
              hostname: "api.notion.com",
              port: 443,
              path: `/v1/pages/${pageId}`,
              method: "PATCH",
              headers: {
                "Authorization": `Bearer ${process.env.NOTION_API_KEY}`,
                "Notion-Version": "2022-06-28",
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(data)
              }
            };

            const req = https.request(options, (res) => {
              let resBody = "";
              res.on("data", (chunk) => resBody += chunk);
              res.on("end", () => {
                if (res.statusCode >= 200 && res.statusCode < 300) {
                  console.log(`성공적으로 Notion 상태를 업데이트했습니다: ${res.statusCode}`);
                } else {
                  console.error(`Notion API 응답 오류 (${res.statusCode}): ${resBody}`);
                }
              });
            });

            req.on("error", (e) => {
              console.error(`Notion API 요청 실패: ${e.message}`);
            });

            req.write(data);
            req.end();
