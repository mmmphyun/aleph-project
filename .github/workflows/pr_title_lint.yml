name: Lint PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint_title:
    name: Validate Conventional PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            chore
            test
            style
            perf
            ci
          scopes: |
            contract
            cloud-a
            cloud-b
            security
            network
            infra
          requireScope: true
          subjectPattern: ^(?!\s*$).+
          subjectPatternError: "PR 제목의 요약 설명이 누락되었습니다."
          headerPattern: '^(\w+)\(([\w$-]+)\):\s*(.+)$'
          headerPatternError: "PR 제목은 '<type>(<scope>): <한글 요약>' 형식이어야 합니다. 예: feat(security): SSH 로그인 실패 룰 구현"
