# CloudShield PR 라벨 자동 부착 규칙 (actions/labeler@v5)
# 목적: 휴먼 에러를 방지하고 파일 변경 경로에 따라 직무(role) 및 도메인(area) 라벨을 100% 자동 부착

"role:cloud-a":
  - changed-files:
      - any-glob-to-any-file:
          - "src/contracts/**"
          - "src/remediation/**"
          - "infra/**"
          - ".github/**"
          - "docs/roles/cloud-a/**"

"role:cloud-b":
  - changed-files:
      - any-glob-to-any-file:
          - "src/collector/**"
          - "src/reporter/**"
          - "docs/roles/cloud-b/**"

"role:security":
  - changed-files:
      - any-glob-to-any-file:
          - "src/detection/**"
          - "docs/roles/security/**"

"role:network":
  - changed-files:
      - any-glob-to-any-file:
          - "network/**"
          - "docs/roles/network/**"

"area:contract":
  - changed-files:
      - any-glob-to-any-file:
          - "src/contracts/**"

"area:remediation":
  - changed-files:
      - any-glob-to-any-file:
          - "src/remediation/**"

"area:collector":
  - changed-files:
      - any-glob-to-any-file:
          - "src/collector/**"

"area:reporter":
  - changed-files:
      - any-glob-to-any-file:
          - "src/reporter/**"

"area:detection":
  - changed-files:
      - any-glob-to-any-file:
          - "src/detection/**"

"area:network":
  - changed-files:
      - any-glob-to-any-file:
          - "network/**"

"area:infra":
  - changed-files:
      - any-glob-to-any-file:
          - "infra/**"

"type:test":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

"type:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"

"type:chore":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "pyproject.toml"
          - "uv.lock"
          - ".pre-commit-config.yaml"
          - "scripts/**"
