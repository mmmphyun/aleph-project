user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    ##
    # 기본 설정 (Basic Settings)
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # 로깅 포맷 정의 (CloudWatch Agent 수집 연계 최적화)
    # Why: 표준 Combined 포맷 외에 인시던트 분석 시 필요한 요청 시간($request_time),
    #      전송 바이트 수, 상위 프록시 헤더($http_x_forwarded_for)를 포함하여
    #      L7 웹 공격(디렉토리 스캐닝, 스프레잉) 분석 시 정밀한 증적을 확보함.
    ##
    log_format cloudshield_combined '$remote_addr - $remote_user [$time_local] '
                                    '"$request" $status $body_bytes_sent '
                                    '"$http_referer" "$http_user_agent" '
                                    '$request_time "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log cloudshield_combined;
    error_log /var/log/nginx/error.log warn;

    ##
    # Gzip 압축 설정
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ##
    # 가상 호스트 설정 (Virtual Host Configs)
    ##
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;
        root /var/www/html;
        index index.html index.htm;

        # 기본 웹 랜딩 페이지
        location / {
            try_files $uri $uri/ =404;
        }

        # 헬스체크 엔드포인트
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"cloudshield-target"}';
        }

        # 모의 L7 공격 타깃 엔드포인트 (디렉토리 스캐닝 / 스프레잉 실증용)
        location /admin {
            auth_basic "Restricted Admin Area";
            auth_basic_user_file /etc/nginx/.htpasswd;
            try_files $uri $uri/ =401;
        }

        location /api/v1/auth/login {
            default_type application/json;
            return 401 '{"error":"Unauthorized","message":"Invalid credentials"}';
        }
    }
}
